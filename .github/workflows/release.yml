name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit hash or tag to build from. Defaults to latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip Chrome extension
        run: pnpm zip

      - name: Zip Firefox extension
        run: pnpm zip:firefox

      - name: Find zip files
        id: zips
        run: |
          CHROME_ZIP=$(find .output -name "*.zip" ! -name "*firefox*" | head -1)
          FIREFOX_ZIP=$(find .output -name "*firefox*.zip" | head -1)
          echo "chrome=$CHROME_ZIP" >> $GITHUB_OUTPUT
          echo "firefox=$FIREFOX_ZIP" >> $GITHUB_OUTPUT

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push — create a new release
            gh release create "${{ github.ref_name }}" \
              --generate-notes \
              "${{ steps.zips.outputs.chrome }}" \
              "${{ steps.zips.outputs.firefox }}"
          else
            # Manual trigger — upload (overwrite) assets on the latest release
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
            gh release upload "$LATEST_TAG" \
              "${{ steps.zips.outputs.chrome }}" \
              "${{ steps.zips.outputs.firefox }}" \
              --clobber
          fi
