name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag (e.g. v1.2.3) or commit hash to release. Defaults to latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        run: |
          # If the ref is already a tag name, use it directly
          INPUT="${{ github.event.inputs.ref }}"
          if git show-ref --verify --quiet "refs/tags/$INPUT" 2>/dev/null; then
            echo "name=$INPUT" >> $GITHUB_OUTPUT
          else
            # Find the tag pointing at HEAD (works for both commit hash and tag checkouts)
            TAG=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -1)
            if [ -z "$TAG" ]; then
              echo "::error::No tag found pointing at this commit. Tag the commit first."
              exit 1
            fi
            echo "name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Zip Chrome extension
        run: pnpm zip

      - name: Zip Firefox extension
        run: pnpm zip:firefox

      - name: Find zip files
        id: zips
        run: |
          CHROME_ZIP=$(find .output -name "*.zip" ! -name "*firefox*" | head -1)
          FIREFOX_ZIP=$(find .output -name "*firefox*.zip" | head -1)
          echo "chrome=$CHROME_ZIP" >> $GITHUB_OUTPUT
          echo "firefox=$FIREFOX_ZIP" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            ${{ steps.zips.outputs.chrome }}
            ${{ steps.zips.outputs.firefox }}
          generate_release_notes: true
